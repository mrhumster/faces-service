apiVersion: apps/v1
kind: Deployment
metadata:
  name: faces-reader
  namespace: go-app
spec:
  replicas: 1
  selector:
    matchLabels:
      app: faces-reader
  template:
    metadata:
      labels:
        app: faces-reader
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8080"
        prometheus.io/path: "/metrics"
    spec:
      containers:
        - name: faces-reader
          image: xomrkob/faces-service:latest
          imagePullPolicy: Always
          envFrom:
            - configMapRef:
                name: faces-service-config
            - secretRef:
                name: go-app-secret
            - secretRef:
                name: minio-credentials
            - secretRef:
                name: faces-internal-token
          env:
            - name: UVICORN_WORKERS
              value: "1"
            # onnxruntime sizes its thread pool from the node's core count (4)
            # while the cgroup only grants this pod 1 CPU, so bursts stalled for
            # a whole 100ms period (throttled ~93ms per hit). Pin the pools to
            # the quota. The CPU limit is deliberately left alone: raising it
            # would take cores away from the rest of the node.
            - name: OMP_NUM_THREADS
              value: "2"
            - name: MKL_NUM_THREADS
              value: "2"
            # Detector input for the interactive paused-frame assist. SCRFD cost is
            # quadratic in this: 320 answers in ~0.4s what 640 needed ~1.5s for.
            # The batch pipeline does not read this. Set to 640 (or 0) to trade
            # speed back for recall on very small faces.
            - name: FACES_ASSIST_DET_SIZE
              value: "320"
          resources:
            requests:
              cpu: 200m
              memory: 512Mi
            limits:
              cpu: "1"
              memory: 2Gi
          readinessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 20
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 3